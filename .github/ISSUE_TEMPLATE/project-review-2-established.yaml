name: "Project Review: Established Stage"
description: "Requested Stage: Established"
title: "[Project Review: Established Stage]: "
labels: ["Project Review"]
body:
  - type: markdown
    attributes:
      value: |
        Projects shall be reviewed by a three-member committee of TAC voting members appointed by the TAC Chair.
        See [IV. Periodic Review Process](https://github.com/hpsfoundation/tac/blob/main/lifecycle_policy.md#iv-periodic-review-process).

  - type: input
    id: project-name
    attributes:
      label: 1. Name of Project
    validations:
      required: true
      
  - type: input
    id: project-proposal
    attributes:
      label: 2. Project Proposal
      description: Please provide a link to the project proposal and the last project review, if any.
      placeholder: https://github.com/hpsfoundation/tac/issues/
    validations:
      required: true

  - type: textarea
    id: project-description
    attributes:
      label: 3. Project Description
    validations:
      required: true
      
  - type: input
    id: project-website
    attributes:
      label: 4. Project Website
      description: Please provide a link to the project website.
      placeholder: https://www.yoursite.org
    validations:
      required: false
      
  - type: textarea
    id: open-source-license
    attributes:
      label: 5. Open Source License
      description: |
        Please provide your license information. 
        - [SPDX Identifier](https://spdx.org/licenses/)
        - If the project also ships data artifacts, what Open Access licenses are used?
      value: No changes since the project proposal or last review.
    validations:
      required: true
      
  - type: input
    id: code-of-conduct
    attributes:
      label: 6. Code of Conduct
      description: Please provide a link to your Code of Conduct.
      placeholder: https://www.codeofconduct.org
      value: No changes since the project proposal or last review.
    validations:
      required: false

  - type: input
    id: source-control
    attributes:
      label: 7. What is the solution for source control?
      value: No changes since the project proposal or last review.
    validations:
      required: true
      
  - type: input
    id: issue-tracking
    attributes:
      label: 8. What is the solution for issue tracking?
      value: No changes since the project proposal or last review.
    validations:
      required: true
      
  - type: textarea
    id: external-dependencies
    attributes:
      label: 9. Please list all external dependencies and their license
      value: No changes since the project proposal or last review.
    validations:
      required: true
      
  - type: textarea
    id: release-methodology
    attributes:
      label: 10. Please describe your release methodology and mechanics
      value: No changes since the project proposal or last review.
    validations:
      required: true
      
  - type: textarea
    id: software-quality
    attributes:
      label: 11. Please describe Software Quality efforts (CI, security, auditing)
      value: No changes since the project proposal or last review.
    validations:
      required: true
      
  - type: dropdown
    id: current-stage
    attributes:
      label: 12. Current Stage
      options:
        - Emerging
        - Established
        - Core
    validations:
      required: true

  - type: dropdown
    id: requested-stage
    attributes:
      label: 13. Requested Stage
      description: |
        Projects or a TAC Voting Member may also request a review at any time to present a case to move to a new stage.
        Projects may also request reassignment to an earlier stage at the time of their review.
        See [IV. Periodic Review Process](https://github.com/hpsfoundation/tac/blob/main/lifecycle_policy.md#iv-periodic-review-process).
      options:
        - Established
      default: 0
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### [Emerging Projects](https://github.com/hpsfoundation/tac/blob/main/lifecycle_policy.md#emerging-projects)
        To be considered for the Emerging Stage, the project must meet the following requirements:

  - type: input
    id: governance-practices
    attributes:
      label: "14. Emerging Stage: Governance Practices"
      description: Please provide a link to your project governance documentation.
      placeholder: https://www.projectgovernance.org
    validations:
      required: true

  - type: textarea
    id: criterion-emerging-status
    attributes:
      label: "15. Emerging Stage: Upon acceptance, projects must list their status prominently on their website/README"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### [Established Stage](https://github.com/hpsfoundation/tac/blob/main/lifecycle_policy.md#established-stage)
        To be considered for Established Stage, the project must meet the Emerging requirements as well as the following:

  - type: textarea
    id: criterion-established-production-use
    attributes:
      label: "16. Established Stage: Document that it is being used successfully in production by at least three independent end users which, in the TAC’s judgment, are of adequate quality and scope."
    validations:
      required: true

  - type: textarea
    id: criterion-established-development-processes
    attributes:
      label: "17. Established Stage: Demonstrate development processes (e.g., use of pull requests, code review, testing, CI) that lower barriers to contribution and ensure software quality necessary for increased adoption."
    validations:
      required: true

  - type: textarea
    id: criterion-established-contribution-flow
    attributes:
      label: "18. Established Stage: Demonstrate a substantial ongoing flow of commits and merged contributions."
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Since these metrics can vary significantly depending on the type, scope and size of a project, the TAC has final judgment over the level of activity that is adequate to meet these criteria.

  - type: textarea
    id: presentation
    attributes:
      label: 19. Presentation
      description: Optional, you can link slides here.
    validations:
      required: false

  - type: textarea
    id: communication-channels
    attributes:
      label: 20. Please list the project's official communication channels
      value: No changes since the project proposal or last review.
    validations:
      required: false

  - type: textarea
    id: social-media
    attributes:
      label: 21. Please list the project's social media accounts
      value: No changes since the project proposal or last review.
    validations:
      required: false

  - type: textarea
    id: financial-sponsorships
    attributes:
      label: 22. Please describe any existing financial sponsorships
      value: No changes since the project proposal or last review.
    validations:
      required: false

  - type: textarea
    id: infrastructure-needs
    attributes:
      label: 23. Please describe the project's infrastructure needs or requests
      value: No changes since the project proposal or last review.
    validations:
      required: false
