name: "Project Review: Emerging Stage"
description: "Requested Stage: Emerging"
title: "[Project Review: Emerging Stage]: "
labels: ["Project Review"]
body:
  - type: markdown
    attributes:
      value: |
        Projects shall be reviewed by a three-member committee of TAC voting members appointed by the TAC Chair.
        See [IV. Periodic Review Process](https://github.com/hpsfoundation/tac/blob/main/lifecycle_policy.md#iv-periodic-review-process).

  - type: input
    id: project-name
    attributes:
      label: 1. Name of Project
    validations:
      required: true
      
  - type: input
    id: project-proposal
    attributes:
      label: 2. Project Proposal
      description: Please provide a link to the project proposal and the last project review, if any.
      placeholder: https://github.com/hpsfoundation/tac/issues/
    validations:
      required: true

  - type: textarea
    id: project-description
    attributes:
      label: 3. Project Description
    validations:
      required: true
      
  - type: textarea
    id: open-source-license
    attributes:
      label: 4. Open Source License
      description: |
        Please provide your license information. 
        - [SPDX Identifier](https://spdx.org/licenses/)
        - If the project also ships data artifacts, what Open Access licenses are used?
      value: No changes since the project proposal or last review.
    validations:
      required: true
      
  - type: input
    id: code-of-conduct
    attributes:
      label: 5. Code of Conduct
      description: Please provide a link to your Code of Conduct.
      placeholder: https://www.codeofconduct.org
      value: No changes since the project proposal or last review.
    validations:
      required: false

  - type: dropdown
    id: current-stage
    attributes:
      label: 6. Current Stage
      options:
        - Emerging
        - Established
        - Core
    validations:
      required: true

  - type: dropdown
    id: requested-stage
    attributes:
      label: 7. Requested Stage
      description: |
        Projects or a TAC Voting Member may also request a review at any time to present a case to move to a new stage.
        Projects may also request reassignment to an earlier stage at the time of their review.
        See [IV. Periodic Review Process](https://github.com/hpsfoundation/tac/blob/main/lifecycle_policy.md#iv-periodic-review-process).
      options:
        - Emerging
      default: 0
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### [Emerging Projects](https://github.com/hpsfoundation/tac/blob/main/lifecycle_policy.md#emerging-projects)
        To be considered for the Emerging Stage, the project must meet the following requirements:

  - type: input
    id: governance-practices
    attributes:
      label: "8. Emerging Stage: Governance Practices"
      description: Please provide a link to your project governance documentation.
      placeholder: https://www.projectgovernance.org
    validations:
      required: true

  - type: input
    id: project-website
    attributes:
      label: "9. Emerging Stage: Project Website"
      description: Projects must list their status prominently on their website/README
      placeholder: https://www.yoursite.org
    validations:
      required: true

  - type: input
    id: open-source-repository
    attributes:
      label: "10. Emerging Stage: Open Source Repository"
      description: Please provide a link to the open source repository for code and issue tracking.
    validations:
      required: true

  - type: textarea
    id: external-dependencies
    attributes:
      label: "11. Emerging Stage: External Dependencies and Licenses"
      description: Please list all external dependencies and their license
      value: No changes since the project proposal or last review.
    validations:
      required: true

  - type: textarea
    id: release-methodology
    attributes:
      label: "12. Emerging Stage: Release Methodology and Mechanics"
      description: Please describe your release methodology and mechanics
      value: No changes since the project proposal or last review.
    validations:
      required: true

  - type: textarea
    id: software-quality
    attributes:
      label: "13. Emerging Stage: Software Quality Efforts (CI)"
      description: Please describe Software Quality efforts (CI)
      value: No changes since the project proposal or last review.
    validations:
      required: true

  - type: textarea
    id: presentation
    attributes:
      label: 14. Presentation
      description: Optional, you can link slides here.
    validations:
      required: false

  - type: textarea
    id: communication-channels
    attributes:
      label: 15. Please list the project's official communication channels
      value: No changes since the project proposal or last review.
    validations:
      required: false

  - type: textarea
    id: social-media
    attributes:
      label: 16. Please list the project's social media accounts
      value: No changes since the project proposal or last review.
    validations:
      required: false

  - type: textarea
    id: financial-sponsorships
    attributes:
      label: 17. Please describe any existing financial sponsorships
      value: No changes since the project proposal or last review.
    validations:
      required: false

  - type: textarea
    id: infrastructure-needs
    attributes:
      label: 18. Please describe the project's infrastructure needs or requests
      value: No changes since the project proposal or last review.
    validations:
      required: false
